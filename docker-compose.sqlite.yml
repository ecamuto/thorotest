services:
  bootstrap:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./testhub.db
    command: ["python", "-m", "backend.bootstrap"]
    volumes:
      - ./testhub.db:/app/testhub.db
      - ./uploads:/app/uploads
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./testhub.db
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./testhub.db:/app/testhub.db
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
